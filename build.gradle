// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        compose_version = '1.5.1'
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath libs.gradle
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${libs.versions.kotlin.asProvider().get()}"
        // 组件化 Component 的 Plugin
        classpath libs.component.plugin
    }
}

plugins {
    id "com.google.devtools.ksp" version libs.versions.kotlin.ksp.get().toString() apply false
    // id "com.google.devtools.ksp" version "1.9.25-1.0.20" apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}