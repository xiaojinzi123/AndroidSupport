plugins {
    id 'com.android.application'
    alias(libs.plugins.compose.compiler)
    id "com.xiaojinzi.kcomponent.plugin"
    id "kotlin-android"
    id "com.google.devtools.ksp"
}

apply from: "../common_lib.gradle"

ksp {
    arg("ModuleName", "app")
}

android {

    signingConfigs {
        debug {
            storeFile file('../sign')
            storePassword '123123'
            keyAlias '123123'
            keyPassword '123123'
        }
        release {
            storeFile file('../sign')
            storePassword '123123'
            keyAlias '123123'
            keyPassword '123123'
        }
    }
    namespace 'com.xiaojinzi.support.demo'

    defaultConfig {
        applicationId "com.xiaojinzi.support.demo"
        versionCode 1
        versionName "1.0"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [HOST: "app"]
            }
        }
        multiDexEnabled true
    }

    buildFeatures {
        // Enables Jetpack Compose for this module
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.kotlinx.coroutines.rx

    // 组件化的库
    implementation libs.component.impl
    ksp libs.component.compiler

    implementation project(':lib-activity-stack')
    implementation project(':lib-init')
    implementation project(':lib-annotation')
    implementation project(':lib-download')
    implementation project(':lib-architecture')
    implementation project(':lib-ktx')
    implementation project(':lib-ktx-retrofit')
    implementation project(':lib-logger')
    implementation project(':lib-compose')


}